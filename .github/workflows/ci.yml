name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static:
    name: Typecheck and lint
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  secrets:
    name: No service-role key in the client bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject EXPO_PUBLIC secrets
        run: |
          if grep -rIn --exclude-dir=node_modules --exclude-dir=.git \
             -E 'EXPO_PUBLIC_[A-Z_]*(SERVICE|SECRET|PRIVATE|STRIPE_SECRET)' .; then
            echo "::error::A secret-looking variable is prefixed EXPO_PUBLIC_ and would ship in the app bundle."
            exit 1
          fi
      - name: Reject committed env files
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is tracked by git."
            exit 1
          fi

  database:
    name: Migrations and RLS checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply migrations and run every check
        run: npm run verify:db
