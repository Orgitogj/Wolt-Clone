name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static:
    name: Typecheck and lint
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  secrets:
    name: No service-role key in the client bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject EXPO_PUBLIC secrets
        run: |
          if grep -rIn --exclude-dir=node_modules --exclude-dir=.git \
             -E 'EXPO_PUBLIC_[A-Z_]*(SERVICE|SECRET|PRIVATE|STRIPE_SECRET)' .; then
            echo "::error::A secret-looking variable is prefixed EXPO_PUBLIC_ and would ship in the app bundle."
            exit 1
          fi
      - name: Reject committed env files
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is tracked by git."
            exit 1
          fi

  database:
    name: Migrations and RLS checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wolt_verify
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      PGPASSWORD: postgres
      PSQL: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d wolt_verify
    steps:
      - uses: actions/checkout@v4
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply stubs and migrations
        run: |
          $PSQL -f supabase/tests/00_supabase_stubs.sql
          for f in supabase/migrations/*.sql; do
            echo "Applying $f"
            $PSQL -f "$f"
          done
      - name: Run RLS, lifecycle and dispatch checks
        run: |
          for t in supabase/tests/*_checks.sql; do
            echo "Running $t"
            $PSQL -f "$t" 2>&1 | tee -a out.txt
          done
          ! grep -q 'FAIL:' out.txt
